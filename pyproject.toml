[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conform-bench"
version = "0.1.0"
description = "A conformance test suite for JSON-schema-constrained output and tool-call parsing across LLM serving engines (vLLM, SGLang, llama.cpp, Ollama)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "James Burrell" }]
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
conform-bench = "conform_bench.cli:main"

[tool.setuptools.packages.find]
include = ["conform_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
