id: single_tool_basic
description: One tool available, prompt clearly needs it; checks correct name and arguments
difficulty: basic
tools:
  - name: get_weather
    description: Get the current weather for a city
    parameters:
      type: object
      properties:
        city: { type: string }
        unit: { type: string, enum: [celsius, fahrenheit] }
      required: [city, unit]
      additionalProperties: false
tool_choice: auto
messages:
  - role: user
    content: "What's the weather like in Nairobi right now? Give it to me in celsius."
expect:
  calls_tool: true
  tool_name: get_weather
  args_checks:
    - path: city
      equals: Nairobi
    - path: unit
      equals: celsius
